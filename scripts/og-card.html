<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#fff; font-family:'Open Sans',sans-serif;
         display:flex; flex-direction:column; justify-content:space-between;
         padding:84px 96px; color:#1c1917; }
  h1 { font-family:'Newsreader',Georgia,serif; font-size:92px; font-weight:500; letter-spacing:-0.02em; color:#0c0a09; }
  .tagline { margin-top:28px; font-size:34px; line-height:1.45; color:#78716c; max-width:880px; }
  .rule { height:1px; background:#e7e5e4; margin:0 0 28px; }
  .meta { display:flex; gap:40px; font-size:24px; color:#a8a29e; }
  .domain { color:#44403c; }
</style></head>
<body>
  <div>
    <h1>Zach Waterfield</h1>
    <p class="tagline">Engineer, investor, and coffee enthusiast based in Toronto, Canada.</p>
  </div>
  <div>
    <div class="rule"></div>
    <div class="meta">
      <span class="domain">zlwaterfield.com</span>
      <span>Writing</span>
      <span>Investing</span>
      <span>Consulting</span>
    </div>
  </div>
</body></html>
